<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 500px; }
        .book-list { margin-top: 20px; width: 100%; border-collapse: collapse; }
        .book-list th { background: #007bff; color: white; padding: 10px; }
        .book-list td { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add Book (Admin Control)</h2>
        <form action="saveBook.jsp" method="POST">
            <input type="text" name="title" placeholder="Book Title" style="width:95%; padding:10px; margin:5px 0;" required><br>
            <input type="number" name="hours" placeholder="Reading Limit (Hours)" style="width:95%; padding:10px; margin:5px 0;" required><br>
            <button type="submit" style="background:#28a745; color:white; border:none; padding:10px 20px; cursor:pointer;">Publish Book</button>
        </form>
    </div>
</body>
</html>
