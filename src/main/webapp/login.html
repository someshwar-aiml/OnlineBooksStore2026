<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BookStore | Join Us</title>
    <style>
        body { background: #1a1a2e; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .box { background: #16213e; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 320px; text-align: center; border-top: 4px solid #e94560; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; background: #0f3460; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #e94560; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #cf3a52; transform: scale(1.05); }
        h2 { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Register</h2>
        <form action="register.html" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <select name="role">
                <option value="user">I am a Reader (User)</option>
                <option value="admin">I am an Admin</option>
            </select>
            <button type="submit" class="btn">Create Account</button>
        </form>
    </div> 
</body>
</html>
